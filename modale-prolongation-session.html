<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Démo Modale prolongation de session</title>
    <link
      rel="stylesheet"
      href="https://main--ds-gouv.netlify.app/dist/dsfr.main.css"
    />
    <link
      rel="stylesheet"
      href="https://main--ds-gouv.netlify.app/dist/utility/utility.main.css"
    />
    <link
      rel="stylesheet"
      href="https://main--ds-gouv.netlify.app/dist/utility/icons/icons.min.css"
    />

  </head>

  <body>
    <dialog
      id="modal-session-timeout"
      class="fr-modal"
      aria-labelledby="modal-session-timeout-title"
      aria-describedby="timer"
      data-fr-concealing-backdrop="false"
      data-fr-js-modal-actionee="true"
    >
      <div class="fr-container fr-container--fluid fr-container-md">
        <div class="fr-grid-row fr-grid-row--center">
          <div class="fr-col-12 fr-col-md-8 fr-col-lg-6">
            <div class="fr-modal__body">
              <div class="fr-modal__header"></div>
              <div class="fr-modal__content modal-expire">
                <h2 id="modal-session-timeout-title" class="fr-modal__title">
                  <span
                    class="fr-icon-info-line fr-icon--lg"
                    aria-hidden="true"
                  ></span>
                  Expiration de session
                </h2>
                <p id="timer">
                  Pour protéger vos données, la durée d'une session est limitée.
                  La déconnexion aura lieu dans
                  <strong
                    ><span id="minutes">9</span> minutes et
                    <span id="seconds">38</span> secondes</strong
                  >.
                </p>
                <ul
                  class="fr-btns-group fr-btns-group--right  fr-btns-group--inline-reverse fr-btns-group--inline-sm""
                >
                  <li>
                    <button type="button" class="fr-btn fr-btn">
                      Prolonger la session
                    </button>
                  </li>
                  <li>
                    <button type="button" class="fr-btn fr-btn--secondary">
                      Se déconnecter maintenant
                    </button>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </dialog>
    <main>
<!-- Contenu d'exemple -->
    </main>
    <script
      type="module"
      src="dsfr-v1.15.4/dist/core/core.module.js"
    ></script>
    <script
      type="module"
      src="dsfr-v1.15.4/dist/component/modal/modal.module.js"
    ></script>
    <script>
      /**
       * Initialise le timer.
       *
       * @param {number} totalSeconds  Durée totale en secondes (paramètre configurable).
       */
      function startSeparatedTimer(totalSeconds) {
        // Références aux deux éléments d’affichage
        const minEl = document.getElementById("minutes");
        const secEl = document.getElementById("seconds");

        // Valeur courante en secondes
        let remaining = totalSeconds;

        // Fonction de mise à jour des secondes (appelée chaque seconde)
        const updateSeconds = () => {
          const seconds = remaining % 60;
          secEl.textContent = seconds.toString().padStart(2, "0");
          if (remaining === 0) clearInterval(secInterval);
        };

        // Fonction de mise à jour des minutes (appelée chaque minute)
        const updateMinutes = () => {
          const minutes = Math.floor(remaining / 60);
          minEl.textContent = minutes.toString().padStart(2, "0");
          if (remaining === 0) clearInterval(minInterval);
        };

        // Première mise à jour immédiate
        updateMinutes();
        updateSeconds();

        // Intervalles distincts
        const secInterval = setInterval(() => {
          if (remaining > 0) remaining--;
          updateSeconds();
          // Si on vient de changer de minute, on rafraîchit l’affichage des minutes
          if (remaining % 60 === 59) updateMinutes();
          if (remaining === 0) clearInterval(secInterval);
        }, 1000);

        // L’intervalle des minutes n’est déclenché qu’une fois par minute,
        // mais on le garde au cas où l’on veut forcer le rafraîchissement
        // même si le compteur atteint 0.
        const minInterval = setInterval(() => {
          if (remaining === 0) clearInterval(minInterval);
          else updateMinutes();
        }, 60000);
      }
      const sessionTimeoutModal = document.getElementById("modal-session-timeout");
      // Exemple : timer de 7 minutes 30 secondes → 450 s
      const duréeEnSecondes = 450; // ← paramètre à adapter
    
      setTimeout(function () {
        window.dsfr(sessionTimeoutModal).modal.disclose();
        startSeparatedTimer(duréeEnSecondes);
      }, 1000);
    </script>
  </body>
</html>
